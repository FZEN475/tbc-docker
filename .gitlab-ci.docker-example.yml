include:

  - component: $CI_SERVER_FQDN/library/to-be-continuous/Docker/gitlab-ci-docker@master
    inputs:
    # Общее
      build-tool: buildah
      # TBC_DEFAULT_DOCKER_BUILD_TOOL: buildah
#        - buildah                             
#        - dind
#        - kaniko
#        - external                           # Собственная реализация
#        - default
    # file:                                   # Путь к Dockerfile def: Dockerfile
    # context-path:                           # Директория с файлами, которые копируются в Image def: .
      config-file: "/tmp/config.json"         # Путь к config.json (аутентификация в registry) def: .docker/config.json
      release-image: "$CI_REGISTRY_IMAGE/buildah:$CI_COMMIT_REF_NAME"  # Путь релиза def: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
    #  DOCKER_REGISTRY_RELEASE_USER           # Учётные данные релиза ($CI_REGISTRY_USER)
    #  DOCKER_REGISTRY_RELEASE_PASSWORD       # $CI_REGISTRY_PASSWORD

      snapshot-image: "$CI_REGISTRY_IMAGE/buildah-snapshot:$CI_COMMIT_REF_SLUG"  # Промежуточный образ, используемый в том числе в роли кэша. Заменяет локальный кэш. def: $CI_REGISTRY_IMAGE/snapshot:$CI_COMMIT_REF_SLUG ($CI_COMMIT_REF_SLUG - общий на ветку)
    #   DOCKER_REGISTRY_SNAPSHOT_USER         # Учётные данные снапшота ($CI_REGISTRY_USER)
    #   DOCKER_REGISTRY_SNAPSHOT_PASSWORD     # $CI_REGISTRY_PASSWORD

    # build-cache-disabled:                   # Отключение кэша (snapshot всё равно делается)
    # metadata:                               # Ключи --label с метадатой. Пример: --label "org.opencontainers.image.url=${CI_PROJECT_URL}"
      
    # skopeo - Утилита для публикации образов. Срабатывает при релизе.
    # publish-args:                           # Доп. аргументы skopeo
      prod-publish-strategy: auto             # manual auto none def: manual

    # Тэги
    # release-extra-tags-pattern:             # Если основной тэг соответствует паттерну, то создаются алиасы (1; 1.1; latest) def: ^v?(?P<major>[0-9]+)\.(?P<minor>[0-9]+)\.(?P<patch>[0-9]+)(?P<suffix>(?P<prerelease>-[0-9A-Za-z-\.]+)?(?P<build>\+[0-9A-Za-z-\.]+)?)$
      release-extra-tags: latest \g<major>.\g<minor> \g<major>  # Какие тэги создаются при соответствии паттерна def: ""
      semrel-release-disabled: true           # Отключение ручного тега def: false
    #   SEMREL_INFO_NEXT_VERSION              # env ручной версии.
    
    # --> BUILDAH <---
    # buildah-image:                          # Образ 
      build-args: "--format=docker"           # Доп. аргументы сборки утилиты buildah
    # container-registries-config-file:       # Расположение файла управления репозитроиями registries.conf. (НЕ AUTH) Читать отдельно!
    # push-args:                              # Доп аргументы docker push ДЛЯ snapshot-image
    # build-cache-location:                   # Локальный кэш. Eсли пустое - snapshot-image/cache def: ""

    # --> DIND <--
    # dind-image:                             # Образ 
    # build-args:                             # Доп. аргументы сборки утилиты dind
    # push-args:                              # Доп аргументы docker push ДЛЯ snapshot-image
    # registry-mirror:                        # Добавляет url зеркала для образов. (--registry-mirror) def: ""
    #   DOCKER_REGISTRY_MIRROR_USER           # Учётные данные зеркала
    #   DOCKER_REGISTRY_MIRROR_PASSWORD

    # --> KANIKO <--
    # kaniko-image:                           # Образ 
    # build-args:                             # Доп. аргументы сборки утилиты kaniko
    # build-cache-location:                   # Локальный кэш. Eсли пустое - snapshot-image/cache def: ""
    # registry-mirror:                        # Добавляет url зеркала для образов. (--registry-mirror) def: ""
    #   DOCKER_REGISTRY_MIRROR_USER           # Учётные данные зеркала
    #   DOCKER_REGISTRY_MIRROR_PASSWORD


    # hadolint - Lint файла Dockerfile
    # hadolint-disabled:                      # def: false
    # hadolint-args:                          # def: ''

    # healthcheck - Запуск контейнера и проверка его состояния на healthy (управляется разделом HEALTHCHECK). Работает только с dind из-за Docker-in-Docker
    # healthcheck-disabled:                   # def: false
    # healthcheck-timeout:                    # Время ожидания старта def: 60
    # healthcheck-options:                    # Аргументы docker run
    # healthcheck-container-args:             # Аргументы для контейнера
    
    # trivy - Проверка контейнеров на уязвимости (по внешним базам данных)
    # trivy-disabled:                         # def: false
    # trivy-image:                            # def: docker.io/aquasec/trivy:latest
    # trivy-args:                             # def: --ignore-unfixed --pkg-types os --exit-on-eol 1 --detection-priority comprehensive --disable-telemetry --skip-version-check

    # sbom - отчёт о составе образа
    # sbom-disabled:                          # def: false
    # sbom-image:                             # def: docker.io/anchore/syft:debug
    # sbom-opts:                              # def: --override-default-catalogers rpm-db-cataloger,alpm-db-cataloger,apk-db-cataloger,dpkg-db-cataloger,portage-cataloger --select-catalogers -file

    # cosign - Включение в отчёт sbom электронной подписи образа.
      cosign-strategy: never                 # Когда добавлять: never, onrelease, always. def: never
    #  cosign-opts: "--verbose --registry-referrers-mode legacy"  # Аргументы утилиты cosign на этапе сборки образа. def: --tlog-upload=false --recursive
    #  cosign-attest-opts: "--verbose"  # Аргументы утилиты cosign на этапе sbom. def: --tlog-upload=false
    #  cosign-annotations: ""                     # Ключи --label с метадатой подписи. Пример: --annotations "com.gitlab.ci.project.path=$CI_PROJECT_URL"
    #  cosign-dist-url: "https://github.com/sigstore/cosign/releases/download/v2.5.0/cosign-linux-amd64"                      # Откуда качать утилиту cosign def: ''

  - component: $CI_SERVER_FQDN/library/cicd/templates/ci-remote-exec/docker-healthcheck@main
    inputs:
      docker-config-file: "/tmp/config.json"
      stage: package-test
      verified-image: "${docker_image_digest}"
      docker-host: "tcp://192.168.2.129:2375"
      global-registry-url: "gitlab-registry.fizn.ru"

  - component: $CI_SERVER_FQDN/library/cicd/templates/sign/oci-cosign@main
    inputs:
      stage: "publish"
      docker-config-file: "/tmp/config.json"
      oci-image-ref: "${docker_image_digest}"
      cosign-key: "gitlab://$CI_PROJECT_ID"

  - component: $CI_SERVER_FQDN/library/cicd/templates/mirroring/oci-repository@main
    inputs:
      stage: "publish"
      src-auth-file: "/tmp/config.json"
      dest-auth-file: "/tmp/config.json"
      src-oci-image: "${docker_image}"
      dest-oci-image: "ghcr.io/fzen475/tbc-docker"

#  - component: $CI_SERVER_FQDN/library/cicd/extands/docker-image-healthcheck-test/remote-docker@main
#  - component: $CI_SERVER_FQDN/library/cicd/extands/docker-image-mirroring/docker-image-mirroring@main
