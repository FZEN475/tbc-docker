stages:
  - build                                # docker-hadolint,
  - package-build                        # docker-kaniko-build, docker-dind-build, docker-buildah-build
  - package-test                         # docker-healthcheck, docker-trivy, docker-sbom
  - publish                              # docker-publish

#  - auto-merge
#  - auto-tag
#  - auto-release

.docker-base:
  services:
    - name: "$TBC_TRACKING_IMAGE"
      command: ["--service", "docker", "8.0.10"]
  before_script:
    - !reference [.docker-scripts]
  tags:
    - docker-builder

# ci-remote-exec/docker-healthcheck

.ci-remote-exec:docker-healthcheck:public:extends:
  tags:
    - docker-builder

.ci-remote-exec:docker-healthcheck:public:needs:
  - job: docker-buildah-build

# sign/oci-cosign

.sign:oci-cosign:public:env-overwrite:
  - |
    SBOM_CYCLONEDX=$(find reports -maxdepth 1 -type f -name 'docker-sbom-*.cyclonedx.json' | head -n1)
    SBOM_NATIVE=$(find reports -maxdepth 1 -type f -name 'docker-sbom-*.native.json' | head -n1)
    TRIVY_NATIVE=$(find reports -maxdepth 1 -type f -name 'docker-trivy-*.native.json' | head -n1)
    TRIVY_GITLAB=$(find reports -maxdepth 1 -type f -name 'docker-trivy-*.gitlab.json' | head -n1)
    TRIVY_CODEQUALITY=$(find reports -maxdepth 1 -type f -name 'docker-trivy-*.gitlab-codequality.json' | head -n1)
    HADOLINT=$(find reports -maxdepth 1 -type f -name 'docker-hadolint-*.codeclimate.json' | head -n1)

  - |
    [ -n "$SBOM_CYCLONEDX" ] || exit 1
    [ -n "$SBOM_NATIVE" ] || exit 1
    [ -n "$TRIVY_NATIVE" ] || exit 1
    [ -n "$TRIVY_GITLAB" ] || exit 1
    [ -n "$TRIVY_CODEQUALITY" ] || exit 1
    [ -n "$HADOLINT" ] || exit 1
      
  - COSIGN_ATTESTS="
    custom|${HADOLINT};
    custom|reports/${HEALTHCHECK};
    cyclonedx|${SBOM_CYCLONEDX};
    custom|${SBOM_NATIVE};
    vuln|${TRIVY_NATIVE};
    vuln|${TRIVY_GITLAB};
    custom|${TRIVY_CODEQUALITY}
    "
      
  - COSIGN_ATTESTS=$(echo "$COSIGN_ATTESTS" | tr -d '\n' | tr -d ' ')
  - echo $COSIGN_ATTESTS
  - ls -al reports/
#
#"reports/docker-sbom-gitlab-registry.gitlab.svc_5000_library_cicd_examples_tbc-docker_buildah-snapshot_0-0-11.cyclonedx.json"
#"reports/docker-sbom-gitlab_registry_gitlab_svc_5000_library_cicd_examples_tbc_docker_buildah_snapshot_0_0_11.cyclonedx.json"


.sign:oci-cosign:public:extends:
  tags:
    - docker-builder

.sign:oci-cosign:public:needs:
  - job: docker-publish
  - job: docker-hadolint
  - job: ci-remote-exec:docker-healthcheck:core
  - job: docker-sbom
  - job: docker-trivy

# mirroring/oci-repository
.mirroring:oci-repository:public:env-overwrite:
  - |
    true

.mirroring:oci-repository:public:needs:
  - job: docker-publish
  - job: docker-hadolint
  - job: ci-remote-exec:docker-healthcheck:core
  - job: docker-sbom
  - job: docker-trivy
  - job: sign:oci-cosign:core

.mirroring:oci-repository:public:extends:
  tags:
    - docker-builder

